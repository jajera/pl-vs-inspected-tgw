# Local preview for the just-the-docs site (no host Ruby required).
#
# From repo root:
#   ./scripts/docs-serve.sh
#   # or: docker compose -f docs/docker-compose.yml up
#
# Open http://127.0.0.1:4000/
#
# After Gemfile changes, recreate the bundle volume:
#   docker compose -f docs/docker-compose.yml down -v

services:
  docs:
    image: ruby:3.4-bookworm
    working_dir: /srv/jekyll
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - docs_bundle:/usr/local/bundle
    environment:
      JEKYLL_ENV: development
      BUNDLE_PATH: /usr/local/bundle
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        bundle config set --local path /usr/local/bundle
        bundle install
        exec bundle exec jekyll serve \
          --host 0.0.0.0 \
          --port 4000 \
          --livereload \
          --livereload-port 35729 \
          --force_polling \
          --watch

volumes:
  docs_bundle:
