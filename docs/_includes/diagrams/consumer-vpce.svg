<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" role="img" aria-label="Create interface VPC endpoint to the provider PrivateLink service">
  <title>Consumer interface VPC endpoint</title>
  <desc>In the consumer VPC private subnets, create an interface endpoint for the provider endpoint service. The subscriber reaches TCP 9000 on the local ENI; PrivateLink carries traffic to the provider NLB.</desc>
