<nav aria-label="Auxiliary" class="aux-nav">
  <ul class="aux-nav-list">
    <li class="aux-nav-list-item">
      <button
        type="button"
        class="site-button conduit-theme-toggle"
        id="plvt-theme-toggle"
        aria-live="polite"
        title="Colour theme: system"
      >
        <span class="conduit-theme-toggle__chip" aria-hidden="true">
          <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v2M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715M16 12a4 4 0 0 0-4-4M19 5l-1.256 1.256M20 12h2"/>
          </svg>
          <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
          </svg>
        </span>
        <span class="visually-hidden">Colour theme: system</span>
      </button>
    </li>
    {% for link in site.aux_links %}
      <li class="aux-nav-list-item">
        <a href="{{ link.last }}" class="site-button"
          {% if site.aux_links_new_tab %}
          target="_blank" rel="noopener noreferrer"
          {% endif %}
        >
          {{ link.first }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>

<script>
(function () {
  var LIGHT = 'conduit';
  var DARK = 'conduit-dark';
  var KEY = 'plvt-docs-theme';
  var MODES = ['auto', 'light', 'dark'];
  var LABELS = {
    auto: 'Colour theme: system',
    light: 'Colour theme: light',
    dark: 'Colour theme: dark'
  };

  function parsePref(value) {
    if (value === 'light' || value === LIGHT) return 'light';
    if (value === 'dark' || value === DARK) return 'dark';
    return 'auto';
  }

  function loadPref() {
    try {
      return parsePref(localStorage.getItem(KEY));
    } catch (e) {
      return 'auto';
    }
  }

  function storePref(pref) {
    try {
      if (pref === 'light' || pref === 'dark') {
        localStorage.setItem(KEY, pref);
      } else {
        localStorage.setItem(KEY, '');
      }
    } catch (e) {}
  }

  function systemScheme() {
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT;
    } catch (e) {
      return LIGHT;
    }
  }

  function resolve(pref) {
    if (pref === 'light') return LIGHT;
    if (pref === 'dark') return DARK;
    return systemScheme();
  }

  function themeStylesheet() {
    return (
      document.querySelector('link[rel="stylesheet"][href*="just-the-docs-conduit"]') ||
      document.querySelector('link[rel="stylesheet"]')
    );
  }

  function syncToggle(pref) {
    var btn = document.getElementById('plvt-theme-toggle');
    if (!btn) return;
    var label = LABELS[pref] || LABELS.auto;
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
    var sr = btn.querySelector('.visually-hidden');
    if (sr) sr.textContent = label;
    document.documentElement.setAttribute('data-theme-pref', pref);
  }

  function apply(pref, persist) {
    pref = parsePref(pref);
    var theme = resolve(pref);
    var link = themeStylesheet();
    if (link) {
      var base = '{{ "/assets/css/just-the-docs-" | relative_url }}';
      link.setAttribute('href', base + theme + '.css');
    } else if (typeof jtd !== 'undefined' && jtd.setTheme) {
      jtd.setTheme(theme);
    }
    if (persist) storePref(pref);
    syncToggle(pref);
  }

  function ready(fn) {
    if (typeof jtd !== 'undefined' && jtd.onReady) {
      jtd.onReady(fn);
    } else if (document.readyState !== 'loading') {
      fn();
    } else {
      document.addEventListener('DOMContentLoaded', fn);
    }
  }

  ready(function () {
    var pref = loadPref();
    syncToggle(pref);
    var btn = document.getElementById('plvt-theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        var current = loadPref();
        var next = MODES[(MODES.indexOf(current) + 1) % MODES.length];
        apply(next, true);
      });
    }
    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () {
        if (loadPref() !== 'auto') return;
        apply('auto', false);
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    } catch (e) {}
  });
})();
</script>
