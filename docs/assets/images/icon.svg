<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Two paths between the same endpoints: one direct, one through an inspection point">
  <title>pl-vs-inspected-tgw</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132025"/>
      <stop offset="1" stop-color="#0b1316"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a3b42" stroke-width="12"/>

  <!-- direct path (PrivateLink) -->
  <line x1="120" y1="186" x2="392" y2="186" stroke="#2dd4bf" stroke-width="52" stroke-linecap="round"/>

  <!-- inspected path (TGW through Network Firewall) -->
  <g stroke="#fbbf24" stroke-width="52" stroke-linecap="round">
    <line x1="120" y1="326" x2="182" y2="326"/>
    <line x1="330" y1="326" x2="392" y2="326"/>
  </g>
  <rect x="222" y="292" width="68" height="68" rx="10" fill="#fbbf24" transform="rotate(45 256 326)"/>
</svg>
